# ─────────────────────────────────────────────────────────────────────────────
#  Auto-deploy to Hostinger on every push to main
#
#  Required GitHub Secrets (Settings → Secrets and variables → Actions):
#    HOSTINGER_SSH_PASS   — Hostinger SSH password
#    DATABASE_URL         — e.g. file:./prod.db  or  mysql://...
#    NEXTAUTH_SECRET      — random 32-char string
#    NEXTAUTH_URL         — https://yourdomain.com
#    DROPBOX_APP_KEY      — from Dropbox developer console
#    DROPBOX_APP_SECRET   — from Dropbox developer console
#    DROPBOX_REFRESH_TOKEN
#    SMTP_USER            — priti@goldendollarconsulting.com (mailbox Graph sends as)
#    SUPPORT_EMAIL        — itsupport@goldendollarconsulting.com
#    AZURE_AD_CLIENT_ID    — enables "Continue with Microsoft" on login + Graph mail
#    AZURE_AD_CLIENT_SECRET
#    AZURE_AD_TENANT_ID    — optional, defaults to "common" (login only)
#    AZURE_MAIL_TENANT_ID  — required for mail — the REAL tenant ID, not "common"
# ─────────────────────────────────────────────────────────────────────────────

name: 🚀 Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual trigger from GitHub UI

env:
  SSH_HOST: 5.183.10.106
  SSH_PORT: 65002
  SSH_USER: u469500580
  APP_DIR:  ~/domains/goldendollarconsulting.com/nodejs

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ───────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build + package (createDeployment.cjs runs `npm run build` + zip)
      - name: Build & create deployment ZIP
        run: node scripts/createDeployment.cjs
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET:       ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL:          ${{ secrets.NEXTAUTH_URL }}
          DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:    ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          SMTP_USER:             ${{ secrets.SMTP_USER }}
          SUPPORT_EMAIL:         ${{ secrets.SUPPORT_EMAIL }}
          AZURE_AD_CLIENT_ID:     ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          AZURE_AD_TENANT_ID:     ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_MAIL_TENANT_ID:   ${{ secrets.AZURE_MAIL_TENANT_ID }}

      # ── 5. Install sshpass on the runner ───────────────────────────────────
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      # ── 6. Upload ZIP to Hostinger via SCP ─────────────────────────────────
      - name: Upload gdc-deploy.zip to server
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
        run: |
          ok=0
          for attempt in 1 2 3 4; do
            echo "Upload attempt $attempt..."
            if sshpass -p "$SSH_PASS" scp \
              -P "$SSH_PORT" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              gdc-deploy.zip \
              "$SSH_USER@$SSH_HOST:~/gdc-deploy.zip"; then
              ok=1; break
            fi
            echo "Attempt $attempt failed — retrying in 30s..."
            sleep 30
          done
          [ "$ok" = "1" ] || { echo "::error::All upload attempts failed"; exit 1; }

      # ── 7. Deploy on the Hostinger server ──────────────────────────────────
      - name: Deploy on Hostinger
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # The server has no .env (env vars live in hPanel), so hand the
          # Prisma CLI its DATABASE_URL via the remote command line.
          REMOTE_ENV=""
          if [ -n "$DATABASE_URL" ]; then
            REMOTE_ENV="DATABASE_URL=$(printf '%q' "$DATABASE_URL") "
          fi
          run_remote() {
            sshpass -p "$SSH_PASS" ssh \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              "$SSH_USER@$SSH_HOST" "${REMOTE_ENV}bash" << 'REMOTE'
          set -eo pipefail

          APP_DIR="$HOME/domains/goldendollarconsulting.com/nodejs"
          ZIP="$HOME/gdc-deploy.zip"

          # Non-interactive SSH doesn't source profiles, so npm isn't on PATH.
          # Try the usual profile files, then nvm, then Hostinger's alt-nodejs.
          [ -f "$HOME/.bashrc" ]  && . "$HOME/.bashrc"  >/dev/null 2>&1 || true
          [ -f "$HOME/.profile" ] && . "$HOME/.profile" >/dev/null 2>&1 || true
          if ! command -v npm >/dev/null 2>&1; then
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1 || true
          fi
          if ! command -v npm >/dev/null 2>&1; then
            NODE_BIN=$(ls -d /opt/alt/alt-nodejs*/root/usr/bin 2>/dev/null | sort -V | tail -1 || true)
            [ -n "$NODE_BIN" ] && export PATH="$NODE_BIN:$PATH"
          fi
          command -v npm >/dev/null 2>&1 || { echo "ERROR: npm not found on server — install Node.js or fix PATH"; exit 1; }
          echo ">>> node: $(command -v node) ($(node -v 2>/dev/null)) | npm: $(command -v npm)"

          echo "──────────────────────────────────────────"
          echo " GDC Deploy  $(date '+%Y-%m-%d %H:%M:%S')"
          echo " Target: $APP_DIR"
          echo "──────────────────────────────────────────"

          # Preserve .env files — they live on the server and must not be wiped
          echo ">>> Preserving .env files..."
          mkdir -p /tmp/gdc-env-backup
          cp "$APP_DIR/.env" /tmp/gdc-env-backup/.env 2>/dev/null || true
          cp "$APP_DIR/.env.local" /tmp/gdc-env-backup/.env.local 2>/dev/null || true

          # Extract new build directly into app dir (unzip -o overwrites files)
          echo ">>> Extracting new deployment into $APP_DIR..."
          mkdir -p "$APP_DIR"
          unzip -o "$ZIP" -d "$APP_DIR"
          cd "$APP_DIR"

          # Restore .env files
          echo ">>> Restoring .env files..."
          cp /tmp/gdc-env-backup/.env "$APP_DIR/.env" 2>/dev/null || true
          cp /tmp/gdc-env-backup/.env.local "$APP_DIR/.env.local" 2>/dev/null || true
          rm -rf /tmp/gdc-env-backup

          # Install Linux-native production packages (Prisma needs Linux binary)
          echo ">>> Installing production dependencies..."
          npm install --omit=dev --no-optional 2>&1 | tail -8

          # Generate Prisma client for Linux
          echo ">>> Generating Prisma client..."
          npx prisma generate 2>&1 | tail -4

          # Sync DB schema (project uses `db push`, there are no migration files)
          echo ">>> Syncing database schema..."
          npx prisma db push --skip-generate

          # Restart via LiteSpeed (Hostinger) — touch tmp/restart.txt
          echo ">>> Triggering LiteSpeed Node.js restart..."
          mkdir -p "$APP_DIR/tmp"
          touch "$APP_DIR/tmp/restart.txt"
          echo "    ✓ restart.txt touched — LiteSpeed will reload the app"

          # Clean up uploaded ZIP
          rm -f "$ZIP"

          echo "──────────────────────────────────────────"
          echo " ✅ Deployment complete!"
          echo "──────────────────────────────────────────"
          REMOTE
          }

          ok=0
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt..."
            if run_remote; then ok=1; break; fi
            echo "Attempt $attempt failed — retrying in 30s..."
            sleep 30
          done
          [ "$ok" = "1" ] || { echo "::error::All deploy attempts failed"; exit 1; }
